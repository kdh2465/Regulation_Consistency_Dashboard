<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공문 분석 카드 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page:       #F4F6F9;
    --bg-card:       #FFFFFF;
    --bg-inactive:   #EEEFF2;
    --border:        #E0E3EA;
    --border-strong: #C8CDD8;
    --text-primary:  #1A1D27;
    --text-secondary:#4B5168;
    --text-muted:    #8B90A4;
    --accent:        #003876;
    --accent-light:  #E8EDF8;
    --accent-mid:    #1A5CB8;
    --success:       #0F6E56;
    --success-light: #E1F5EE;
    --danger:        #C0392B;
    --danger-light:  #FDEDEC;
    --warning:       #854F0B;
    --warning-light: #FEF3E2;
    --gold:          #FFB900;
    --radius-sm:     4px;
    --radius:        8px;
    --radius-card:   12px;
    --shadow-card:   0 1px 3px rgba(0,0,0,.06), 0 1px 8px rgba(0,0,0,.04);
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: var(--accent);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .site-header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .site-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-logo-icon {
    width: 36px; height: 36px;
    background: var(--gold);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .site-logo-text strong {
    display: block;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .site-logo-text span {
    display: block;
    color: rgba(255,255,255,.65);
    font-size: 11px;
  }
  .header-stats {
    display: flex;
    gap: 20px;
  }
  .header-stat {
    text-align: center;
  }
  .header-stat .num {
    display: block;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }
  .header-stat .label {
    display: block;
    color: rgba(255,255,255,.6);
    font-size: 11px;
    margin-top: 2px;
  }

  /* ── Layout ── */
  .page-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 48px;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toolbar-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .toolbar-title strong {
    color: var(--text-primary);
  }
  .toolbar-right {
    display: flex;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-weight: 500;
    transition: background .12s, border-color .12s;
    text-decoration: none;
  }
  .btn:hover { background: var(--bg-page); border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #002A5C; border-color: #002A5C; color: #fff; }

  /* ── Filter area ── */
  .filter-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-group-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .6px;
    white-space: nowrap;
    margin-right: 2px;
  }
  .filter-sep {
    width: 1px;
    height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }
  .filter-tab {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-page);
    color: var(--text-muted);
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;
  }
  .filter-tab:hover { border-color: var(--border-strong); color: var(--text-secondary); }
  .filter-tab.active-tab-type {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .filter-tab.active-tab-urgent {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }
  .filter-reset {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px 6px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    transition: color .12s;
  }
  .filter-reset:hover { color: var(--accent); }
  .filter-active-label {
    font-size: 11px;
    color: var(--text-muted);
    padding: 3px 8px;
    background: var(--bg-page);
    border-radius: 20px;
    border: 1px dashed var(--border-strong);
    display: none;
  }
  .filter-active-label.visible { display: inline-block; }

  /* ── Card list ── */
  #card-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  #card-list .empty-state { grid-column: 1 / -1; }

  /* ── Card ── */
  .gm-card {
    border-radius: var(--radius-card);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
    box-shadow: var(--shadow-card);
    /* 높이 균일화: 세로 flex — 접힘=최대 높이, 펼침=평균 높이(JS가 지정) */
    display: flex;
    flex-direction: column;
  }
  .gm-card.active {
    background: var(--bg-card);
    border-color: var(--border);
  }
  .gm-card.active:hover {
    border-color: var(--border-strong);
    box-shadow: 0 2px 12px rgba(0,56,118,.08);
  }
  .gm-card.inactive {
    background: var(--bg-inactive);
    border-color: var(--border);
    opacity: .75;
  }

  /* Card head */
  .gm-card-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .gm-card.inactive .gm-card-head { cursor: default; }

  .gm-badge-col {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .gm-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .badge-internal  { background: var(--accent-light); color: var(--accent); }
  .badge-external  { background: var(--success-light); color: var(--success); }
  .badge-inactive  { background: #E4E6EC; color: var(--text-muted); border: 1px solid var(--border); }
  .badge-urgent    { background: var(--danger-light); color: var(--danger); }
  .badge-attach    { background: #F0F0F0; color: var(--text-muted); }
  .badge-reply     { background: #FFF8E1; color: #7A5800; }

  .gm-head-main { flex: 1; min-width: 0; }
  .gm-doc-num {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 500;
    letter-spacing: .3px;
  }
  .gm-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .gm-card.inactive .gm-title { color: var(--text-secondary); }
  .gm-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .gm-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .gm-meta i { font-size: 13px; color: var(--text-muted); }
  .gm-meta.danger { color: var(--danger); font-weight: 500; }
  .gm-meta.danger i { color: var(--danger); }

  .gm-toggle-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 2px;
    transition: all .12s;
    white-space: nowrap;
  }
  .gm-toggle-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .gm-toggle-btn .chevron { font-size: 14px; transition: transform .2s; }
  .gm-toggle-btn.open .chevron { transform: rotate(180deg); }

  /* Divider */
  .gm-divider { height: 1px; background: var(--border); margin: 0; }

  /* Card body (expanded) */
  .gm-body { display: none; padding: 16px 18px; }
  .gm-body.open {
    display: block;
    /* 펼침 시 카드가 고정 높이를 넘으면 본문 영역만 내부 스크롤 */
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  .gm-section { margin-bottom: 18px; }
  .gm-section:last-child { margin-bottom: 0; }
  .gm-section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gm-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Info grid */
  .gm-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
    background: var(--bg-page);
    border-radius: var(--radius);
    padding: 12px 14px;
    border: 1px solid var(--border);
  }
  .gm-info-item { display: flex; flex-direction: column; gap: 2px; }
  .gm-info-k { font-size: 11px; color: var(--text-muted); }
  .gm-info-v { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .gm-info-v.deadline { color: var(--danger); }

  /* Summary */
  .gm-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.75;
    background: var(--bg-page);
    border-radius: var(--radius);
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
  }

  /* Todo */
  .gm-todo-list { display: flex; flex-direction: column; gap: 6px; }
  .gm-todo {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 1px solid transparent;
  }
  .gm-todo.red    { background: var(--danger-light);  border-color: #F5C6C6; }
  .gm-todo.yellow { background: var(--warning-light); border-color: #FCDBA8; }
  .gm-todo.green  { background: var(--success-light); border-color: #9FE1CB; }
  .gm-todo-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .gm-todo.red    .gm-todo-icon { color: var(--danger); }
  .gm-todo.yellow .gm-todo-icon { color: var(--warning); }
  .gm-todo.green  .gm-todo-icon { color: var(--success); }
  .gm-todo-text { flex: 1; font-size: 13px; color: var(--text-primary); line-height: 1.5; }
  .gm-todo-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; padding-top: 2px; }

  /* Attachments */
  .gm-attach-list { display: flex; flex-direction: column; gap: 6px; }
  .gm-attach {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-page);
  }
  .gm-attach i { font-size: 18px; color: var(--text-muted); flex-shrink: 0; }
  .gm-attach-name { font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .gm-attach-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Reply */
  .gm-reply-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: #F0FBF7;
    border: 1px solid #9FE1CB;
  }
  .gm-reply-box i { font-size: 16px; color: var(--success); }
  .gm-reply-label { font-size: 13px; color: var(--success); font-weight: 500; }
  .gm-reply-detail { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Memo */
  .gm-memo {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.8;
    background: var(--bg-page);
    border-radius: var(--radius);
    padding: 10px 14px;
    border: 1px dashed var(--border-strong);
  }

  /* Card footer */
  .gm-card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 18px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,.015);
    margin-top: auto;   /* 고정 높이 카드에서 항상 하단 고정 */
    flex-shrink: 0;
  }
  .gm-foot-left {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .gm-status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .gm-status-dot.active   { background: var(--success); }
  .gm-status-dot.inactive { background: var(--text-muted); }
  .gm-status-text { font-size: 12px; color: var(--text-muted); }
  .gm-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .12s;
  }
  .gm-action-btn:hover { border-color: var(--border-strong); color: var(--text-secondary); background: var(--bg-card); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state i { font-size: 36px; margin-bottom: 12px; display: block; }
  .empty-state p { font-size: 14px; }

  /* Responsive */
  @media (max-width: 760px) {
    #card-list { grid-template-columns: 1fr; }
    .page-wrap { padding: 16px 12px 40px; }
    .gm-info-grid { grid-template-columns: 1fr; }
    .header-stats { display: none; }
    .site-header-inner { padding: 12px 16px; }
    .gm-card-head { gap: 10px; }
    .gm-badge-col { display: none; }
    .toolbar-title { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="site-header-inner">
    <div class="site-logo">
      <div class="site-logo-icon">🇰🇷</div>
      <div class="site-logo-text">
        <strong>공문 분석 시스템</strong>
        <span>AI 기반 공문 자동 분석 · 요약 · 관리</span>
      </div>
    </div>
    <div class="header-stats">
      <div class="header-stat">
        <span class="num" id="stat-total">0</span>
        <span class="label">전체</span>
      </div>
      <div class="header-stat">
        <span class="num" id="stat-active">0</span>
        <span class="label">활성</span>
      </div>
      <div class="header-stat">
        <span class="num" id="stat-urgent">0</span>
        <span class="label">긴급</span>
      </div>
    </div>
  </div>
</header>

<!-- Main -->
<main class="page-wrap">

  <div class="toolbar">
    <div class="toolbar-left">
      <span class="toolbar-title">공문 목록 <strong id="count-label">0</strong>건</span>
    </div>
    <div class="toolbar-right">
      <button class="btn" onclick="location.reload()" title="파일을 다시 읽어 최신 카드를 표시">
        <i class="ti ti-refresh" aria-hidden="true"></i> 새로읽기
      </button>
      <button class="btn btn-primary" onclick="addSampleCard()">
        <i class="ti ti-plus" aria-hidden="true"></i> 공문 추가
      </button>
      <button class="btn" onclick="expandAll()">
        <i class="ti ti-arrows-maximize" aria-hidden="true"></i> 전체 펼치기
      </button>
      <button class="btn" onclick="collapseAll()">
        <i class="ti ti-arrows-minimize" aria-hidden="true"></i> 전체 접기
      </button>
    </div>
  </div>

  <div class="filter-area">
    <!-- 그룹 1: 상태 (그룹 내 배타 선택) -->
    <span class="filter-group-label">상태</span>
    <div class="filter-group">
      <button class="filter-tab" id="ftab-active"   onclick="setStatusFilter('active')">활성</button>
      <button class="filter-tab" id="ftab-inactive" onclick="setStatusFilter('inactive')">비활성</button>
    </div>

    <div class="filter-sep"></div>

    <!-- 그룹 2: 공문 유형 (그룹 내 배타 선택) -->
    <span class="filter-group-label">유형</span>
    <div class="filter-group">
      <button class="filter-tab" id="ftab-external" onclick="setOriginFilter('external')">외부공문</button>
      <button class="filter-tab" id="ftab-internal" onclick="setOriginFilter('internal')">내부공문</button>
    </div>

    <div class="filter-sep"></div>

    <!-- 그룹 3: 긴급도 (그룹 내 배타 선택) -->
    <span class="filter-group-label">긴급도</span>
    <div class="filter-group">
      <button class="filter-tab" id="ftab-urgent" onclick="setPriorityFilter('urgent')">
        <i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:11px;margin-right:2px"></i>긴급
      </button>
      <button class="filter-tab" id="ftab-normal" onclick="setPriorityFilter('normal')">일반</button>
    </div>

    <span class="filter-active-label" id="filter-active-label"></span>
    <button class="filter-reset" id="filter-reset-btn" onclick="resetAllFilters()" style="display:none">
      <i class="ti ti-x" aria-hidden="true" style="font-size:11px"></i> 초기화
    </button>
  </div>

  <div id="card-list" role="list" aria-label="공문 분석 카드 목록"></div>

</main>

<script>
const cards = [
  {
    "id": 1,
    "active": false,
    "docNum": "녹색건축실-8784",
    "type": "external",
    "typeLabel": "외부",
    "title": "「제6회 그린리모델링 챌린지」 개최 안내 및 홍보 협조 요청",
    "sender": "국토안전관리원장",
    "receiver": "수신자참조",
    "issued": "2026-08-18",
    "received": "2026-08-19",

        "desc": "수원과학대학교 교수초빙 모집학과 및 전공 현황 자료로 추정됨"
      }
    ],
    "reply": false,
    "memo": "본문에는 첨부 공문서를 확인하라는 안내만 있으며, 교수초빙 심사위원 추천에 관한 세부사항은 첨부파일에 있을 것으로 보입니다. 공개여부는 `비공개(6)`, 보안등급은 `평문`으로 각각 기재되어 있으므로 문서 취급 시 비공개 지정에 유의해야 합니다. 공람현황에는 총 55명 중 10명 열람·45명 미열람으로 기재되어 있으나, 괄호 안에는 15명의 성명과 소속이 열거되어 있어 명단의 의미 및 집계 기준은 [확인 필요]합니다. 첨부파일의 실제 내용이 제공되지 않아 추천 대상, 추천서 제출기한, 회신처, 담당자 및 처리절차는 확인할 수 없습니다."
  }
];

const expandedIds = new Set();
// 각 그룹 내부에서는 하나만 선택되고, 서로 다른 그룹의 조건은 함께 적용됩니다.
let statusFilter   = null; // active | inactive
let originFilter   = null; // external | internal
let priorityFilter = null; // urgent | normal
let sampleCount    = 2;

function isUrgentCard(card) {
  return card.todos.some(t => t.level === 'red');
}

function getFilteredCards() {
  return cards.filter(c => {
    const statusOk = !statusFilter || (statusFilter === 'active' ? c.active : !c.active);
    const originOk = !originFilter || c.type === originFilter;
    const urgent = isUrgentCard(c);
    const priorityOk = !priorityFilter || (priorityFilter === 'urgent' ? urgent : !urgent);
    return statusOk && originOk && priorityOk;
  });
}

function setExclusiveFilter(group, value) {
  // 이미 선택된 항목을 다시 클릭하면 선택 해제 → 해당 카테고리 전체 표시
  const current = { status: statusFilter, origin: originFilter, priority: priorityFilter }[group];
  if (current === value) value = null;

  if (group === 'status') statusFilter = value;
  if (group === 'origin') originFilter = value;
  if (group === 'priority') priorityFilter = value;

  const groups = {
    status: ['active', 'inactive'],
    origin: ['external', 'internal'],
    priority: ['urgent', 'normal']
  };
  groups[group].forEach(key => {
    const el = document.getElementById('ftab-' + key);
    if (!el) return;
    el.classList.toggle(key === 'urgent' ? 'active-tab-urgent' : 'active-tab-type', key === value);
  });
  updateFilterLabel();
  renderCards();
}

function setStatusFilter(value) { setExclusiveFilter('status', value); }
function setOriginFilter(value) { setExclusiveFilter('origin', value); }
function setPriorityFilter(value) { setExclusiveFilter('priority', value); }

function resetAllFilters() {
  statusFilter = originFilter = priorityFilter = null;
  ['active','inactive','external','internal','normal'].forEach(key => {
    const el = document.getElementById('ftab-' + key);
    if (el) el.classList.remove('active-tab-type');
  });
  const urgentBtn = document.getElementById('ftab-urgent');
  if (urgentBtn) urgentBtn.classList.remove('active-tab-urgent');
  updateFilterLabel();
  renderCards();
}

function updateFilterLabel() {
  const labels = {
    active:'활성', inactive:'비활성', external:'외부공문', internal:'내부공문',
    urgent:'긴급', normal:'일반'
  };
  const parts = [statusFilter, originFilter, priorityFilter].filter(Boolean).map(v => labels[v]);
  const labelEl = document.getElementById('filter-active-label');
  const resetBtn = document.getElementById('filter-reset-btn');
  if (parts.length) {
    labelEl.textContent = parts.join(' + ');
    labelEl.classList.add('visible');
    resetBtn.style.display = 'flex';
  } else {
    labelEl.textContent = '';
    labelEl.classList.remove('visible');
    resetBtn.style.display = 'none';
  }
}

function updateStats() {
  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-active').textContent = cards.filter(c => c.active).length;
  document.getElementById('stat-urgent').textContent = cards.filter(c => c.active && c.todos.some(t => t.level === 'red')).length;
}

function renderCards() {
  const list = document.getElementById('card-list');
  const filtered = getFilteredCards();
  document.getElementById('count-label').textContent = filtered.length;
  updateStats();

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><i class="ti ti-file-off" aria-hidden="true"></i><p>해당 조건의 공문이 없습니다.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(c => cardHTML(c)).join('');
  equalizeCardHeights();
}

/* 카드 높이 균일화
   - 접힌 카드: 모든 카드의 '접힘 상태 자연 높이' 중 최댓값으로 통일
   - 펼친 카드: 모든 카드의 '펼침 상태 자연 높이'의 평균값으로 통일,
     내용이 넘치는 카드는 .gm-body 내부 스크롤로 열람 */
function equalizeCardHeights() {
  const cardEls = [...document.querySelectorAll('#card-list .gm-card')];
  if (!cardEls.length) return;

  const collapsedHeights = [], expandedHeights = [];
  cardEls.forEach(el => {
    el.style.height = '';                     // 측정 전 초기화
    const body = el.querySelector('.gm-body');
    const wasOpen = body && body.classList.contains('open');
    if (body) body.classList.remove('open');
    collapsedHeights.push(el.offsetHeight);   // 접힘 자연 높이
    if (body) {
      body.classList.add('open');
      expandedHeights.push(el.offsetHeight);  // 펼침 자연 높이
      if (!wasOpen) body.classList.remove('open');
    }
  });

  const hCollapsed = Math.max(...collapsedHeights);
  const hExpanded = Math.round(expandedHeights.reduce((a, b) => a + b, 0) / expandedHeights.length);

  cardEls.forEach(el => {
    const body = el.querySelector('.gm-body');
    const isOpen = body && body.classList.contains('open');
    el.style.height = (isOpen ? hExpanded : hCollapsed) + 'px';
  });
}

// 창 크기가 바뀌면 자연 높이도 달라지므로 다시 계산
let _eqResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_eqResizeTimer);
  _eqResizeTimer = setTimeout(equalizeCardHeights, 150);
});

function cardHTML(c) {
  const isOpen = expandedIds.has(c.id);
  const urgentCount = c.todos.filter(t => t.level === 'red').length;

  const badges = `
    <span class="gm-badge ${c.type === 'internal' ? 'badge-internal' : 'badge-external'}">
      <i class="ti ${c.type === 'internal' ? 'ti-building' : 'ti-world'}" aria-hidden="true" style="font-size:11px"></i>${c.typeLabel}
    </span>
    ${!c.active ? `<span class="gm-badge badge-inactive"><i class="ti ti-archive" aria-hidden="true" style="font-size:10px"></i> 비활성</span>` : ''}
    ${urgentCount > 0 ? `<span class="gm-badge badge-urgent"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:10px"></i> 긴급 ${urgentCount}</span>` : ''}
    ${c.attachments.length > 0 ? `<span class="gm-badge badge-attach"><i class="ti ti-paperclip" aria-hidden="true" style="font-size:10px"></i> ${c.attachments.length}</span>` : ''}
    ${c.reply ? `<span class="gm-badge badge-reply"><i class="ti ti-send" aria-hidden="true" style="font-size:10px"></i> 회신필요</span>` : ''}
  `;

  const infoGrid = `
    <div class="gm-info-grid">
      <div class="gm-info-item"><span class="gm-info-k">발신</span><span class="gm-info-v">${c.sender}</span></div>
      <div class="gm-info-item"><span class="gm-info-k">수신</span><span class="gm-info-v">${c.receiver}</span></div>
      <div class="gm-info-item"><span class="gm-info-k">시행일자</span><span class="gm-info-v">${c.issued}</span></div>
      <div class="gm-info-item"><span class="gm-info-k">접수일자</span><span class="gm-info-v">${c.received}</span></div>
      <div class="gm-info-item"><span class="gm-info-k">처리기한</span><span class="gm-info-v deadline">${c.deadline}</span></div>
      <div class="gm-info-item"><span class="gm-info-k">보안등급</span><span class="gm-info-v">${c.security}</span></div>
    </div>`;

  const todos = c.todos.map(t => `
    <div class="gm-todo ${t.level}">
      <i class="ti ${t.icon} gm-todo-icon" aria-hidden="true"></i>
      <div class="gm-todo-text">${t.text}</div>
      <div class="gm-todo-date">${t.date}</div>
    </div>`).join('');

  const attachs = c.attachments.length > 0
    ? c.attachments.map(a => `
      <div class="gm-attach">
        <i class="ti ${a.icon}" aria-hidden="true"></i>
        <div><div class="gm-attach-name">${a.name}</div><div class="gm-attach-desc">${a.desc}</div></div>
      </div>`).join('')
    : `<div style="font-size:13px;color:var(--text-muted);padding:4px 0"><i class="ti ti-file-off" aria-hidden="true" style="margin-right:6px"></i>첨부파일 없음</div>`;

  const replyBlock = c.reply ? `
    <div class="gm-section">
      <div class="gm-section-label"><i class="ti ti-send" aria-hidden="true" style="font-size:12px"></i> 회신</div>
      <div class="gm-reply-box">
        <i class="ti ti-circle-check" aria-hidden="true"></i>
        <div>
          <div class="gm-reply-label">회신 필요 — 기한: ${c.replyDeadline}</div>
          <div class="gm-reply-detail">${c.replyTo}</div>
        </div>
      </div>
    </div>` : '';

  return `
  <div class="gm-card ${c.active ? 'active' : 'inactive'}" id="card-${c.id}" role="listitem">
    <div class="gm-card-head" onclick="${c.active ? `toggleCard(${c.id})` : ''}"
         role="${c.active ? 'button' : ''}"
         aria-expanded="${isOpen}"
         ${c.active ? `tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')toggleCard(${c.id})"` : ''}>
      <div class="gm-badge-col">${badges}</div>
      <div class="gm-head-main">
        <div class="gm-doc-num"><i class="ti ti-file-description" aria-hidden="true" style="font-size:12px;margin-right:3px"></i>${c.docNum}</div>
        <div class="gm-title">${c.title}</div>
        <div class="gm-meta-row">
          <div class="gm-meta"><i class="ti ti-building-bank" aria-hidden="true"></i>${c.sender.split(' ')[0]}</div>
          <div class="gm-meta"><i class="ti ti-calendar-event" aria-hidden="true"></i>시행 ${c.issued}</div>
          <div class="gm-meta${urgentCount > 0 ? ' danger' : ''}"><i class="ti ti-clock" aria-hidden="true"></i>기한 ${c.deadline}</div>
        </div>
      </div>
      ${c.active ? `
      <button class="gm-toggle-btn ${isOpen ? 'open' : ''}"
              onclick="event.stopPropagation();toggleCard(${c.id})"
              aria-label="${isOpen ? '접기' : '펼치기'}">
        ${isOpen ? '접기' : '펼치기'}<i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      </button>` : ''}
    </div>

    <div class="gm-body ${isOpen ? 'open' : ''}" id="body-${c.id}">
      <div class="gm-divider" style="margin-bottom:16px"></div>

      <div class="gm-section">
        <div class="gm-section-label"><i class="ti ti-info-circle" aria-hidden="true" style="font-size:12px"></i> 기본 정보</div>
        ${infoGrid}
      </div>

      <div class="gm-section">
        <div class="gm-section-label"><i class="ti ti-align-left" aria-hidden="true" style="font-size:12px"></i> 핵심 요약</div>
        <div class="gm-summary">${c.summary}</div>
      </div>

      <div class="gm-section">
        <div class="gm-section-label"><i class="ti ti-checklist" aria-hidden="true" style="font-size:12px"></i> To Do 목록</div>
        <div class="gm-todo-list">${todos}</div>
      </div>

      <div class="gm-section">
        <div class="gm-section-label"><i class="ti ti-paperclip" aria-hidden="true" style="font-size:12px"></i> 첨부파일</div>
        <div class="gm-attach-list">${attachs}</div>
      </div>

      ${replyBlock}

      <div class="gm-section">
        <div class="gm-section-label"><i class="ti ti-notes" aria-hidden="true" style="font-size:12px"></i> 에이전트 메모</div>
        <div class="gm-memo">${c.memo}</div>
      </div>
    </div>

    <div class="gm-card-foot">
      <div class="gm-foot-left">
        <div class="gm-status-dot ${c.active ? 'active' : 'inactive'}"></div>
        <span class="gm-status-text">${c.active ? '활성' : '비활성'} · ${c.type === 'internal' ? '내부공문' : '외부공문'}</span>
      </div>
      <button class="gm-action-btn" onclick="toggleActive(${c.id})">
        <i class="ti ${c.active ? 'ti-archive' : 'ti-refresh'}" aria-hidden="true"></i>
        ${c.active ? '비활성화' : '활성화'}
      </button>
    </div>
  </div>`;
}

function toggleCard(id) {
  const card = cards.find(c => c.id === id);
  if (!card || !card.active) return;
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  renderCards();
}

function toggleActive(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  card.active = !card.active;
  if (!card.active) expandedIds.delete(id);
  renderCards();
}

function expandAll() {
  getFilteredCards().filter(c => c.active).forEach(c => expandedIds.add(c.id));
  renderCards();
}

function collapseAll() {
  expandedIds.clear();
  renderCards();
}

let sampleNum = 0;
function addSampleCard() {
  sampleNum++;
  sampleCount++;
  const types = ['internal','external'];
  const t = types[sampleNum % 2];
  cards.push({
    id: sampleCount,
    active: true,
    docNum: `샘플팀-2026-${1000 + sampleCount}`,
    type: t,
    typeLabel: t === 'internal' ? '내부' : '외부',
    title: `[샘플 ${sampleNum}] 새로 수신된 공문 제목이 이곳에 표시됩니다`,
    sender: t === 'internal' ? '기획처장' : '외부기관장',
    receiver: '수신자 참조',
    issued: '2026-08-19', received: '2026-08-19',
    deadline: '2026-09-01',
    security: '평문 (공개)',
    summary: '이 카드는 공문 추가 버튼으로 생성된 샘플 공문입니다. 실제 시스템에서는 AI가 분석한 공문 내용이 자동으로 채워집니다.',
    todos: [
      { level:'red',   icon:'ti-alert-triangle', text:'긴급 처리 필요 항목 — 담당자 즉시 확인', date:'2026-09-01' },
      { level:'green', icon:'ti-check',          text:'일반 검토 및 보관', date:'2026-09-30' },
    ],
    attachments: [],
    reply: false,
    memo: '샘플 카드입니다. 실제 공문 분석 시 AI 에이전트가 자동으로 메모를 작성합니다.',
  });
  renderCards();
  setTimeout(() => {
    const el = document.getElementById(`card-${sampleCount}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

renderCards();
</script>
</body>
</html>
