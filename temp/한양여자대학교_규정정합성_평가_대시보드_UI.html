<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>한양여자대학교 규정 정합성 평가 대시보드</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--line:#e7eaf0;--text:#1f2937;--muted:#6b7280;--navy:#243b64;--blue:#4777d8;--red:#e45b63;--amber:#e7a52d;--green:#36a269;--shadow:0 7px 24px rgba(34,52,84,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Pretendard","Noto Sans KR",Arial,sans-serif;font-size:14px}.app{max-width:1480px;margin:auto;padding:28px 34px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:13px;align-items:center}.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 5px 13px #243b6435}.eyebrow{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.08em;margin-bottom:4px}.title{font-size:23px;font-weight:800;letter-spacing:-.04em}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;color:#475569;cursor:pointer;font-weight:700}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn:hover{filter:brightness(.97)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}.summary-block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:19px 21px;box-shadow:var(--shadow)}.block-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:800;font-size:15px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.summary-block:nth-child(2) .dot{background:#8b6bd9}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{border-radius:11px;padding:15px 17px;background:#f8fafc;border:1px solid #edf0f5}.metric-label{color:var(--muted);font-size:12px;margin-bottom:8px}.metric-value{font-size:29px;font-weight:850;letter-spacing:-.05em}.metric-value.red{color:var(--red)}.metric-value.amber{color:var(--amber)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.section-title{font-size:17px;font-weight:800}.section-title span{color:var(--muted);font-size:13px;font-weight:500;margin-left:7px}.toolbar-right{display:flex;gap:8px;align-items:center}.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;color:#475569}.groups{display:flex;flex-direction:column;gap:14px}.group-items{display:flex;flex-direction:column}.group{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 3px 15px rgba(34,52,84,.035)}.group-header{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;background:#fbfcfe;border-bottom:1px solid var(--line)}.group-name{display:flex;align-items:center;gap:10px;font-weight:800}.group-name small{font-size:11px;color:var(--muted);font-weight:600}.count{min-width:27px;height:25px;padding:0 8px;border-radius:20px;background:#eef3ff;color:var(--blue);display:grid;place-items:center;font-size:12px}.count.red{color:var(--red);background:#fff0f0}.count.amber{color:#a87310;background:#fff7e5}.item{padding:18px 20px;border-bottom:1px solid #f0f2f6}.item:last-child{border-bottom:0}.item.completed{background:#f1f4f7;color:#8b95a3;order:99}.item.completed .issue-title,.item.completed .severity-label{color:#8b95a3}.item.completed .code{background:#e2e7ed;color:#7d8795}.item.completed .detail{opacity:.72}.verify-btn{border:1px solid #cfd6df;background:#fff;color:#536174;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}.verify-btn:hover{background:#f0f3f6}.item.completed .verify-btn{border-color:#b9c2cc;background:#e3e8ed;color:#687585}.item-actions{display:flex;align-items:center;gap:10px}.item-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;cursor:pointer}.issue{display:flex;gap:10px;align-items:flex-start}.code{font-family:ui-monospace,monospace;font-size:11px;color:var(--blue);background:#edf3ff;padding:5px 7px;border-radius:5px;white-space:nowrap}.issue-title{font-weight:750;line-height:1.45}.issue-title .sub{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:4px}.severity{display:flex;align-items:center;gap:8px;white-space:nowrap}.severity-label{font-size:12px;color:var(--muted)}.scale{display:flex;gap:3px}.scale i{width:8px;height:8px;border-radius:2px;background:#e7eaf0}.scale i.on{background:var(--red)}.scale.amber i.on{background:var(--amber)}.chevron{color:#9aa5b5;margin-left:8px;transition:.2s}.item.open .chevron{transform:rotate(180deg)}.detail{display:none;margin:16px 0 0 74px;padding:16px 18px;background:#fafbfe;border:1px solid #edf0f5;border-radius:10px}.item.open .detail{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}.detail h4{margin:0 0 6px;font-size:12px;color:#64748b}.detail p{margin:0;line-height:1.65;color:#374151}.detail .full{grid-column:1/-1}.tag{display:inline-flex;border-radius:5px;padding:4px 7px;font-size:11px;background:#eef2f7;color:#526174;margin-right:5px}.recommend{border-left:3px solid var(--blue);padding-left:11px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:850px){.app{padding:20px 15px}.summary{grid-template-columns:1fr}.topbar,.toolbar{align-items:flex-start;gap:14px;flex-direction:column}.toolbar-right{width:100%;justify-content:flex-end}.detail{margin-left:0}.detail-grid{grid-template-columns:1fr}.detail .full{grid-column:auto}.item-top{grid-template-columns:1fr}.severity{justify-content:flex-start}}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 22px}.tab-btn{border:0;background:transparent;padding:13px 18px;color:var(--muted);font-weight:800;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy)}.tab-panel{display:none}.tab-panel.active{display:block}.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.panel-title{font-size:20px;font-weight:850;letter-spacing:-.035em;margin-bottom:6px}.panel-desc{color:var(--muted);font-size:13px}.upload-area{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.file-status{color:var(--muted);font-size:12px}.analysis-empty{background:#fff;border:1px dashed #cfd6df;border-radius:13px;text-align:center;padding:40px 20px;color:var(--muted)}.analysis-empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.hidden{display:none!important}
@media(max-width:850px){.panel-heading{flex-direction:column}.upload-area{justify-content:flex-start}.tabs{overflow:auto}.tab-btn{white-space:nowrap}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">H</div><div><div class="eyebrow">REGULATION INSIGHT</div><div class="title">한양여자대학교 규정 정합성 평가 대시보드</div></div></div></header>
<nav class="tabs" role="tablist" aria-label="정합성 분석 화면">
<button class="tab-btn active" data-tab="current" onclick="switchTab('current')">현행규정 정합성</button>
<button class="tab-btn" data-tab="revision" onclick="switchTab('revision')">제·개정규정 정합성</button>
</nav>
<section id="panel-current" class="tab-panel active">
<div class="panel-heading"><div><div class="panel-title">현행규정 정합성 평가</div><div class="panel-desc">“상위규정 ↔ 대학규정”, “대학규정 ↔ 대학규정”에 대한 정합성 평가</div></div></div>
<div id="dashboard-current"></div>
</section>
<section id="panel-revision" class="tab-panel">
<div class="panel-heading"><div><div class="panel-title">제·개정규정 정합성 평가</div><div class="panel-desc">“상위규정 ↔ 제개정규정”, “대학규정 ↔ 제개정규정”에 대한 정합성 평가</div></div><div class="upload-area"><span id="file-status" class="file-status">선택된 파일 없음</span><input id="revision-files" type="file" multiple hidden onchange="handleFiles(this.files)"><button class="btn primary" onclick="document.getElementById('revision-files').click()">제개정규정 불러오기</button><button id="analyze-btn" class="btn hidden" onclick="analyzeRevision()">정합성 분석</button></div></div>
<div id="dashboard-revision"></div>
</section>
</div>
<script>
const currentData=[
 {key:'lr-inc',title:'상위법령 ↔ 대학규정 · 정합성 불일치',type:'inc',items:[{code:'LR-INC-001',title:'등록금 반환사유 및 반환기준',sub:'대학 등록금에 관한 규칙 제6조 ↔ 학칙 제44조',level:5,regs:'학칙 제44조',law:'대학 등록금에 관한 규칙 제6조',basis:'상위 규정은 자퇴·미복학 제적·휴학 등 반환사유와 별표 기준을 정하고 있으나, 내부 조항의 반환 예외 및 기준이 일부 다르게 규정되어 직접 충돌 가능성이 확인됩니다.',rec:'학칙 제44조의 반환사유·금액 기준을 「대학 등록금에 관한 규칙」 제6조 및 별표에 따라 통일하고, 관련 신청서와 안내문을 함께 개정.'},{code:'LR-INC-002',title:'교원 징계 불복절차의 기관 명칭',sub:'교원지위법 제9조 ↔ 교원징계위원회 규정 제4조',level:4,regs:'교원징계위원회 규정 제4조',law:'교원의 지위 향상 및 교육활동 보호를 위한 특별법 제9조',basis:'내부 규정은 “교육부에 설치한 재심위원회”라고 표현하나 현행 법령은 “심사위원회에 소청심사를 청구”하도록 규정하고 있습니다.',rec:'법령 명칭·심사기관·소청심사 용어를 현행 법령에 맞게 정비하고 징계처분 통지서에도 동일하게 반영.'}]},
 {key:'lr-rev',title:'상위법령 ↔ 대학규정 · 정합성 검토 필요',type:'rev',items:[{code:'LR-REV-001',title:'개인정보 국외 이전의 법정 근거',sub:'개인정보 보호법 제28조의8 ↔ 개인정보보호 규정 제17조의3',level:3,regs:'개인정보보호 규정 제17조의3',law:'개인정보 보호법 제28조의8',basis:'내부 규정은 국외 이전을 정보주체 동의 방식으로만 규정합니다. 법률은 동의 외에도 계약 이행, 인증·보호조치 등 여러 근거를 두고 있어 대학의 정책적 제한인지 확인이 필요합니다.',rec:'국외 이전 업무별 법정 근거를 구분하고, 동의서·처리방침·해외 위탁계약을 함께 점검.'},{code:'LR-REV-002',title:'만 14세 미만 아동 개인정보 처리',sub:'개인정보 보호법 제22조의2 ↔ 개인정보보호 규정 제14조',level:2,regs:'개인정보보호 규정 제14조',law:'개인정보 보호법 제22조의2 및 시행령 제17조의2',basis:'법정대리인 동의와 확인 절차는 대체로 부합하나, 2026년 시행령 개정사항 및 실제 온라인 동의 절차의 반영 여부가 확인되어야 합니다.',rec:'최신 시행령 조문을 재인용하고 입학·비교과·상담 서식 및 온라인 화면을 점검.'}]},
 {key:'ir-inc',title:'대학규정 ↔ 대학규정 · 정합성 불일치',type:'inc',items:[{code:'IR-INC-001',title:'성적 이의신청 기간 및 정정 절차',sub:'학업성적 처리규정 제4조 ↔ 학칙 시행세칙 제13조·제16조',level:4,regs:'학업성적 처리규정 제4조, 학칙 시행세칙 제13조·제16조',law:'해당 없음',basis:'한 규정은 성적정정기간 내 이의신청을, 다른 규정은 성적열람기간 내 신청을 정하고 있어 적용기간의 기준이 일치하지 않습니다.',rec:'성적열람·이의신청·성적정정의 기간과 담당자 조치를 하나의 기준표로 통일.'}]},
 {key:'ir-rev',title:'대학규정 ↔ 대학규정 · 정합성 검토 필요',type:'rev',items:[{code:'IR-REV-001',title:'학생 징계 재심청구와 처분 효력',sub:'학생상벌에 관한 규정 제12조·제13조',level:3,regs:'학생상벌에 관한 규정 제12조·제13조',law:'학칙 및 관련 학생 권리보장 규정 확인 필요',basis:'재심청구기간은 7일이고 재심청구 시 원처분은 효력을 상실한다고 규정합니다. 총장의 재심 요구와 학생 재심의 관계, 효력 상실의 의미를 명확히 할 필요가 있습니다.',rec:'재심청구의 효과를 집행정지 또는 처분 취소·재처분 중 무엇인지 명확히 하고 통지서와 절차를 정비.'},{code:'IR-REV-002',title:'교원·직원 징계위원회 운영체계',sub:'교원징계위원회 규정·직원징계위원회 규정',level:2,regs:'교원징계위원회 규정 제3조·제4조, 직원징계위원회 규정 제3조',law:'학교법인 정관 관련 조항 확인 필요',basis:'교원은 정관 조항을 준용하고 직원은 직원인사위원회로 대치하고 있어 위원회 구성·권한·재심 절차의 연결관계를 함께 확인할 필요가 있습니다.',rec:'정관·인사규정·징계위원회 규정·전결표의 위계와 담당 권한을 하나의 매트릭스로 정리.'}]}
];
let revisionData=[];let selectedFiles=[];
function stars(n,amber=false){return '<span class="scale '+(amber?'amber':'')+'">'+[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')+'</span>'}
function summaryMarkup(mode,data){const names=mode==='current'?['상위법령 ↔ 대학규정','대학규정 ↔ 대학규정']:['상위법령 ↔ 제개정규정','대학규정 ↔ 제개정규정'];const counts=Object.fromEntries(data.map(g=>[g.key,g.items.filter(x=>!x.completed).length]));return `<section class="summary"><div class="summary-block"><div class="block-head"><span class="dot"></span>${names[0]}</div><div class="metrics"><div class="metric"><div class="metric-label">정합성 불일치</div><div class="metric-value red">${counts['lr-inc']||0}</div></div><div class="metric"><div class="metric-label">정합성 검토필요</div><div class="metric-value amber">${counts['lr-rev']||0}</div></div></div></div><div class="summary-block"><div class="block-head"><span class="dot"></span>${names[1]}</div><div class="metrics"><div class="metric"><div class="metric-label">정합성 불일치</div><div class="metric-value red">${counts['ir-inc']||0}</div></div><div class="metric"><div class="metric-label">정합성 검토필요</div><div class="metric-value amber">${counts['ir-rev']||0}</div></div></div></div></section>`}
function dashboardMarkup(mode,data){const total=data.reduce((n,g)=>n+g.items.filter(x=>!x.completed).length,0);const date=mode==='current'?'최근 분석일 2026. 08. 21.':(total?'제개정규정 분석 결과':'분석 대기');return summaryMarkup(mode,data)+`<div class="toolbar"><div class="section-title">정합성 검토 항목 <span>총 ${total}건 · ${date}</span></div><div class="toolbar-right"><select class="select" id="filter-${mode}" onchange="renderDashboard('${mode}')"><option value="all">전체 분류</option><option value="inc">불일치</option><option value="rev">검토 필요</option></select><button class="btn" onclick="toggleAll('${mode}',true)">전체 펼치기</button><button class="btn" onclick="toggleAll('${mode}',false)">전체 접기</button></div></div><div class="groups" id="groups-${mode}"></div>`}
function renderDashboard(mode){const data=mode==='current'?currentData:revisionData;const root=document.getElementById('dashboard-'+mode);const old=document.getElementById('filter-'+mode);const filter=old?old.value:'all';root.innerHTML=dashboardMarkup(mode,data);document.getElementById('filter-'+mode).value=filter;const groups=document.getElementById('groups-'+mode);if(mode==='revision'&&!data.length){groups.innerHTML='<div class="analysis-empty"><strong>제·개정규정을 불러와 분석해 주세요.</strong>여러 파일을 한 번에 선택할 수 있으며, 분석 전 모든 개수는 0으로 표시됩니다.</div>';return}groups.innerHTML=data.filter(g=>filter==='all'||g.type===filter).map(g=>{const active=g.items.filter(x=>!x.completed).sort((a,b)=>b.level-a.level), completed=g.items.filter(x=>x.completed).sort((a,b)=>b.level-a.level);return `<section class="group"><div class="group-header"><div class="group-name"><span class="dot" style="background:${g.type==='inc'?'var(--red)':'var(--amber)'}"></span>${g.title}<small>${active.length}건</small></div><span class="count ${g.type==='inc'?'red':'amber'}">${active.length}</span></div><div class="group-items">${[...active,...completed].map(x=>itemMarkup(mode,g,x)).join('')}</div></section>`}).join('')}
function itemMarkup(mode,g,x){return `<article class="item ${x.completed?'completed':''}"><div class="item-top" onclick="this.parentElement.classList.toggle('open')"><div class="issue"><span class="code">${x.code}</span><div class="issue-title">${x.title}<span class="sub">${x.sub}</span></div></div><div class="item-actions"><div class="severity"><span class="severity-label">${g.type==='inc'?'불일치':'검토 필요'} ${x.level}/5</span>${stars(x.level,g.type==='rev')}<span class="chevron">⌄</span></div><button class="verify-btn" onclick="event.stopPropagation();verifyItem('${mode}','${g.key}','${x.code}')">${x.completed?'완료취소':'검증완료'}</button></div></div><div class="detail"><div class="detail-grid"><div><h4>관련 내부 규정</h4><p>${x.regs}</p></div><div><h4>관련 상위법령</h4><p>${x.law}</p></div><div class="full"><h4>${g.type==='inc'?'불일치':'검토 필요'} 내용 및 근거</h4><p>${x.basis}</p></div><div class="full"><h4>수정 권고안</h4><p class="recommend">${x.rec}</p></div></div></div></article>`}
function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab))}
function handleFiles(files){selectedFiles=[...files];document.getElementById('file-status').textContent=selectedFiles.length?`${selectedFiles.length}개 파일 선택됨`:'선택된 파일 없음';document.getElementById('analyze-btn').classList.toggle('hidden',!selectedFiles.length);revisionData=[];renderDashboard('revision')}
function analyzeRevision(){if(!selectedFiles.length)return;const btn=document.getElementById('analyze-btn');btn.disabled=true;btn.textContent='분석 중…';setTimeout(()=>{revisionData=JSON.parse(JSON.stringify(currentData)).map(g=>({...g,title:g.title.replaceAll('대학규정 ↔ 대학규정','대학규정 ↔ 제개정규정').replaceAll('상위법령 ↔ 대학규정','상위법령 ↔ 제개정규정'),items:g.items.map((x,i)=>({...x,code:x.code.replace(/^(LR|IR)/,m=>m==='LR'?'RR':'UR'),completed:false}))}));btn.disabled=false;btn.textContent='다시 분석';document.getElementById('file-status').textContent=`${selectedFiles.length}개 파일 분석 완료`;renderDashboard('revision')},650)}
function verifyItem(mode,key,code){const data=mode==='current'?currentData:revisionData;const item=data.find(g=>g.key===key)?.items.find(x=>x.code===code);if(!item)return;item.completed=!item.completed;renderDashboard(mode)}
function toggleAll(mode,open){document.querySelectorAll(`#dashboard-${mode} .item`).forEach(x=>x.classList.toggle('open',open))}
renderDashboard('current');renderDashboard('revision');
</script></body></html>
